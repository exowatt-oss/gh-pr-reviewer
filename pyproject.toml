[project]
name = "gh-pr-reviewer"
version = "0.1.0"
description = "Self-hosted AI pull-request reviewer for GitHub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "jinja2>=3.1.6",
    "forwarded-auth[fastapi] @ git+https://github.com/exowatt-oss/forwarded-auth@58fd85f8ee6624c430aa23c3947d62f8840e5a52",
    "pr-agent==0.47.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
